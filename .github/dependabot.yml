# Weekly updates for the Go modules, the actions and the base image. Dependabot does not
# read the ARG versions in the Dockerfile. `task outdated` shows them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      terraform-plugin:
        patterns: ['github.com/hashicorp/terraform-plugin-*']
      # One PR for all security updates. A bump of one module can need a bump of another.
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
