# Each week, compare the tool versions in the Dockerfile and the workflows with the
# latest releases. Dependabot does not read these versions. While a version is old, one
# issue with the label `outdated` is open and shows the table. The run closes the issue
# when each version is the latest, and fails only when it cannot read a latest release.
name: outdated

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: |
          if table=$(task -x outdated); then code=0; else code=$?; fi
          [ "$code" -le 1 ] || exit "$code"
          issue=$(gh issue list --label outdated --state open --limit 1 --json number --jq '.[].number')
          if [ "$code" = 0 ]; then
            [ -z "$issue" ] || gh issue close "$issue" --comment 'Each pinned version is the latest release.'
            exit 0
          fi
          body=$(printf 'Change each old version. The first weekly run after that closes this issue.\n\n~~~\n%s\n~~~\n' "$table")
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh label create outdated --color fbca04 --description 'A pinned tool version is old' --force
            gh issue create --title 'A pinned tool version is old' --label outdated --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
