# Each week, compare the tool versions in the Dockerfile and the workflows with the
# latest releases. Dependabot does not read these versions. If a version is old, the run
# fails, and GitHub sends a notification.
name: outdated

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: task outdated
        env:
          GH_TOKEN: ${{ github.token }}
