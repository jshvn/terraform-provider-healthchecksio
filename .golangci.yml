# golangci-lint for `task check`. The standard linters (errcheck, govet, ineffassign,
# staticcheck, unused), and the linters for errors, HTTP bodies and security.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      # The error of a Close after a full read gives no information.
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    rules:
      # A test sends requests to the URL of the test server.
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
