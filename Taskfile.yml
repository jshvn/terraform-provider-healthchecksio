# terraform-provider-healthchecksio is a Terraform and OpenTofu provider for the
# healthchecks.io Management API v3. The registry address is jshvn/healthchecksio.
#
# Each Go command operates in the toolbox image (Dockerfile). Thus, a laptop or a CI runner
# must supply only a container engine, go-task and jq (for the menu check). CLAUDE.md gives
# the design.
version: '3'

set: [errexit, pipefail]
silent: true

vars:
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      elif command -v docker >/dev/null 2>&1; then echo docker
      elif command -v container >/dev/null 2>&1; then echo container
      else echo docker
      fi
  IMAGE: terraform-provider-healthchecksio-toolbox:local
  # The server for the acceptance tests. Change the tag and the digest together.
  HC_IMAGE: healthchecks/healthchecks:v4.4@sha256:aa08a61b0dcfd83f1332eab195d5cec1b595ae076eb8388cadf8a3d597114f9b
  # Apple container shows a progress spinner on a terminal. `docker run` has no such flag.
  QUIET: '{{if eq .ENGINE "container"}}--progress none{{end}}'
  # Apple container gives a container 1 GB. Four Go builds in parallel need more. Docker
  # sets no limit.
  MEMORY: '{{if eq .ENGINE "container"}}--memory 4G{{end}}'

tasks:
  default:
    desc: Print the menu
    # ponytail: a menu that we keep manually. go-task cannot put tasks in groups or add notes
    # to them. Thus, add a row below for each new task; menu-drift fails until the row is
    # there. `task --list` gives the view that go-task makes.
    cmds:
      - |
        b= c= d= r=
        if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
          b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        fi
        group() { printf '\n%s   %s\n' "$c$1$r" "$d$2$r"; }
        row() {
          if [ ${#1} -le 26 ]; then printf '  %-26s %s\n' "$1" "$2"
          else printf '  %s\n  %-26s %s\n' "$1" '' "$2"; fi
          [ -z "${3:-}" ] || note "$3"
        }
        note() { printf '  %-26s %s\n' '' "$d$1$r"; }

        printf '\n%s   %s\n' "${b}terraform-provider-healthchecksio${r}" "${d}Terraform and OpenTofu provider for the healthchecks.io API v3${r}"

        group read 'looks at GitHub, changes nothing'
        row 'task outdated' 'Each pinned tool version and the latest release' 'needs gh; fails when a version is old'
        note 'the weekly outdated workflow runs it'

        group checks 'offline, no credentials, inside the toolbox image'
        row 'task check' 'Everything CI runs offline, and this menu against the tasks'
        note 'golangci-lint, go test, terraform fmt, actionlint, the docs'
        note 'fails when docs/ does not agree with the schema: run task docs'
        row 'task acc' 'Acceptance tests with terraform, then with tofu' 'a local healthchecks server in a container; RUN=<regexp> for one test'
        note 'tofu skips the list and action tests: OpenTofu does not support them'
        row 'task fmt' 'gofmt -w in place'

        group build 'writes files in the checkout'
        row 'task docs' 'Make docs/ again from the schema, templates/ and examples/'
        row 'task build' 'Build the release archives for each platform into dist/, with no signature'

        group write 'CI only, after a tag push'
        row 'task release' 'Sign the archives and publish the GitHub release of the tag at HEAD'
        note 'needs GPG_PRIVATE_KEY_BASE64, GPG_PASSPHRASE, GITHUB_TOKEN'
        note 'registers with no registry'

        group toolbox '{{.ENGINE}}, {{.IMAGE}}, built from the Dockerfile'
        row 'task image' 'Build the image' 'skipped when it exists'
        row 'task run -- <cmd>' 'Run any command in the image with the repo mounted'
        row 'task clean' 'Remove the image and the Go caches' 'after a Dockerfile edit'
        echo

  run:
    desc: 'Run any command in the toolbox image, e.g. task run -- go test ./...'
    deps: [image]
    cmds:
      - >-
        {{.ENGINE}} run {{.QUIET}} {{.MEMORY}} --rm -i $(test -t 0 && test -t 1 && echo -t || true)
        --user $(id -u):$(id -g)
        -v "{{.ROOT_DIR}}":/work -w /work
        -e HOME=/tmp -e GOCACHE=/work/.cache/go-build -e GOMODCACHE=/work/.cache/go-mod
        -e GPG_PRIVATE_KEY_BASE64 -e GPG_PASSPHRASE -e GITHUB_TOKEN
        {{.IMAGE}} {{.CLI_ARGS}}

  image:
    desc: Build the toolbox image
    run: once
    # If the image is there, task does not build it again. Thus, a change to the Dockerfile
    # does not cause a new build. Do `task clean`. Then the next task builds a new image.
    status:
      - '{{.ENGINE}} image inspect {{.IMAGE}} >/dev/null 2>&1'
    cmds:
      - '{{.ENGINE}} build -t {{.IMAGE}} .'

  check:
    desc: Everything CI runs offline - golangci-lint, go test, terraform fmt, actionlint, the docs, the menu
    cmds:
      # On the host, because the toolbox image has no task and no jq.
      - task: menu-drift
      # golangci-lint also runs gofmt and go vet (.golangci.yml). actionlint examines the
      # workflows.
      - task: run
        vars:
          CLI_ARGS: sh -c 'golangci-lint run ./... && go test ./... && terraform fmt -check -recursive -diff examples && go tool actionlint'
      # The registries show docs/ from the release tag. Thus, docs/ must agree with the
      # schema before each tag.
      - task: run
        vars:
          CLI_ARGS: >-
            sh -c 'go tool tfplugindocs validate --provider-name healthchecksio >/dev/null 2>/tmp/validate.log || { cat /tmp/validate.log >&2; exit 1; };
            rm -rf .cache/docs && go tool tfplugindocs generate --provider-name healthchecksio --rendered-website-dir .cache/docs >/dev/null 2>&1 &&
            diff -r docs .cache/docs >&2 || { echo "docs/ is not current: run task docs" >&2; exit 1; }'

  docs:
    desc: Make docs/ again from the schema, templates/ and examples/
    cmds:
      - task: run
        vars: {CLI_ARGS: go tool tfplugindocs generate --provider-name healthchecksio}

  acc:
    desc: Acceptance tests against a local healthchecks server, with terraform, then with tofu
    deps: [image]
    vars:
      RUN: '{{.RUN | default "."}}'
    cmds:
      - |
        set -eu
        e={{.ENGINE}}; hc=tfhc-acc-$$
        # A new random key for each run. The server and the key go away at the end.
        key=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        rokey=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        net=""
        if [ "$e" = docker ]; then docker network create "$hc" >/dev/null; net="--network $hc"; fi
        cleanup() {
          $e {{if eq .ENGINE "container"}}delete{{else}}rm{{end}} -f "$hc" >/dev/null 2>&1 || true
          if [ "$e" = docker ]; then docker network rm "$hc" >/dev/null 2>&1 || true; fi
        }
        trap cleanup EXIT
        $e run {{.QUIET}} -d --name "$hc" $net -e DB_NAME=/data/hc.sqlite -e SECRET_KEY=acc \
          -e 'ALLOWED_HOSTS=*' -e SITE_ROOT=http://hc.test {{.HC_IMAGE}} >/dev/null
        i=0
        until $e exec "$hc" ./fetchstatus.py >/dev/null 2>&1; do
          i=$((i + 1)); [ "$i" -lt 60 ] || { echo "the healthchecks server did not start" >&2; exit 1; }
          sleep 2
        done
        $e exec "$hc" ./manage.py shell -c "
        from django.contrib.auth.models import User
        from hc.accounts.models import Profile, Project
        from hc.api.models import Channel
        u = User.objects.create_user('acc', 'acc@example.org')
        Profile.objects.for_user(u)
        p = Project.objects.create(owner=u, name='acc', badge_key='acc', api_key='$key', api_key_readonly='$rokey')
        for n in ('acc-email', 'acc-ops'):
            Channel.objects.create(project=p, kind='email', value=n + '@example.org', email_verified=True, name=n)
        " >/dev/null
        # Docker finds the server by name on its network. Apple container gives each
        # container an address on one shared network. awk reads all of its input, so no
        # command in the pipe stops early. `|| true` lets the next line report a missing address.
        if [ "$e" = docker ]; then host=$hc; else
          host=$($e inspect "$hc" | tr -d ' \n' | grep -o '"ipv4Address":"[0-9.]*' | awk -F'"' 'NR == 1 { print $4 }' || true)
          [ -n "$host" ] || { echo "cannot find the address of the healthchecks server" >&2; exit 1; }
        fi
        for cli in terraform tofu; do
          echo "== acceptance tests with $cli"
          provider_host=registry.terraform.io
          if [ "$cli" = tofu ]; then provider_host=registry.opentofu.org; fi
          HEALTHCHECKSIO_API_URL="http://$host:8000/api/v3/" HEALTHCHECKSIO_API_KEY="$key" HEALTHCHECKSIO_ACC_READONLY_KEY="$rokey" \
          TF_ACC=1 TF_ACC_TERRAFORM_PATH="/usr/local/bin/$cli" TF_ACC_PROVIDER_HOST="$provider_host" \
          $e run {{.QUIET}} {{.MEMORY}} --rm $net --user $(id -u):$(id -g) -v "{{.ROOT_DIR}}":/work -w /work \
            -e HOME=/tmp -e GOCACHE=/work/.cache/go-build -e GOMODCACHE=/work/.cache/go-mod \
            -e HEALTHCHECKSIO_API_URL -e HEALTHCHECKSIO_API_KEY -e HEALTHCHECKSIO_ACC_READONLY_KEY -e TF_ACC -e TF_ACC_TERRAFORM_PATH -e TF_ACC_PROVIDER_HOST \
            {{.IMAGE}} go test ./internal/provider -count=1 -v -timeout 20m -run '{{.RUN}}'
        done

  build:
    desc: Build the release archives for each platform into dist/, with no signature
    cmds:
      - task: run
        vars: {CLI_ARGS: goreleaser release --snapshot --clean --skip=sign,publish}

  release:
    desc: Sign the archives and publish the GitHub release of the tag at HEAD - CI only
    preconditions:
      - sh: test -n "$GPG_PRIVATE_KEY_BASE64" && test -n "$GPG_PASSPHRASE" && test -n "$GITHUB_TOKEN"
        msg: GPG_PRIVATE_KEY_BASE64, GPG_PASSPHRASE and GITHUB_TOKEN must be set. The release workflow sets them.
    cmds:
      - task: run
        vars:
          CLI_ARGS: >-
            sh -c 'set -eu; export GNUPGHOME=$(mktemp -d);
            printf "%s" "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import;
            export GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ {print \$10; exit}");
            goreleaser release --clean'

  outdated:
    desc: Each pinned tool version and the latest release - fails when one is old, needs gh
    cmds:
      - |
        latest() { gh api "repos/$1/releases/latest" --jq .tag_name 2>/dev/null || echo "?"; }
        pin() { sed -n "s/^ARG $1=//p" Dockerfile; }
        old=0
        row() {
          printf '%-14s %-10s %s\n' "$1" "$2" "$3"
          if [ "${2#v}" != "${3#v}" ]; then old=1; fi
        }
        printf '%-14s %-10s %s\n' TOOL PINNED LATEST
        row terraform "$(pin TERRAFORM)" "$(latest hashicorp/terraform)"
        row tofu "$(pin TOFU)" "$(latest opentofu/opentofu)"
        row goreleaser "$(pin GORELEASER)" "$(latest goreleaser/goreleaser)"
        row healthchecks "$(echo '{{.HC_IMAGE}}' | sed 's/.*:\(v[0-9.]*\)@.*/\1/')" "$(latest healthchecks/healthchecks)"
        row golangci-lint "$(pin GOLANGCI_LINT)" "$(latest golangci/golangci-lint)"
        row go-task "$(sed -n 's/^ *version: //p' .github/workflows/test.yml)" "$(latest go-task/task)"
        if [ "$old" = 1 ]; then echo "A pinned version is not the latest release." >&2; exit 1; fi

  fmt:
    desc: gofmt -w in place
    cmds:
      - task: run
        vars: {CLI_ARGS: gofmt -w main.go internal}

  clean:
    desc: Remove the toolbox image and the Go caches - the next task makes them again
    cmds:
      - '{{.ENGINE}} image rm {{.IMAGE}} >/dev/null 2>&1 || true'
      - chmod -R u+w .cache 2>/dev/null || true
      - rm -rf .cache dist

  # Every public task has a desc and a menu row, and every row names a task. default and
  # help are the menu itself. Needs task and jq wherever lint runs.
  menu-drift:
    internal: true
    cmds:
      - |
        rows=$(grep -oE "row ['\"]task [^ '\"]+" '{{.ROOT_TASKFILE}}' | sed -E "s/^row ['\"]task //" || true)
        bad=$(task -t '{{.ROOT_TASKFILE}}' --list-all --json --no-status | jq -r --arg rows "$rows" '
          ($rows | split("\n") | map(select(. != ""))) as $r
          | [.tasks[] | select(.task != "default" and .task != "help")] as $t
          | ($t[] | select(.desc == "") | "task \(.task): no desc; describe it or mark it internal"),
            ($t[] | select(.task | IN($r[]) | not) | "task \(.task): no row in the menu"),
            ($r[] | select(IN($t[].task) | not) | "row task \(.): no such task")')
        [ -z "$bad" ] || { printf '%s\n' "$bad" >&2; exit 1; }
